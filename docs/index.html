<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anthony Panizza DIAPO - Vote</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#fff;padding:20px;min-height:100vh;box-sizing:border-box}
h1{font-size:1.4rem;margin:0 0 20px}
button{display:block;width:100%;padding:18px;margin:10px 0;font-size:1.1rem;border:0;border-radius:12px;background:#3b82f6;color:#fff}
button:active{background:#2563eb}button.sel{background:#22c55e}button:disabled{opacity:.6}
.msg{margin-top:16px;color:#94a3b8;text-align:center}
</style></head><body>
<div id="app"><p class="msg">Connexion…</p></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const app = document.getElementById('app');
const hostId = new URLSearchParams(location.search).get('h');
const cid = localStorage.cid ||= (crypto.randomUUID?.() || String(Math.random()).slice(2));
const voted = () => JSON.parse(localStorage.voted || '{}');
let s, conn, msg = '', lastPoll;

function renderWords() {
  const w = s.words, key = 'w' + w.id;
  if (app.dataset.k !== key) {
    app.dataset.k = key;
    app.innerHTML = '<h1></h1><input id="wi" maxlength="40" autocomplete="off" placeholder="Un mot…" style="width:100%;padding:16px;font-size:1.2rem;border-radius:12px;border:0;box-sizing:border-box"><button id="ws">Envoyer</button><p class="msg" id="wm"></p>';
    app.querySelector('h1').textContent = w.question;
    const send = () => {
      const i = document.getElementById('wi');
      const words = i.value.split(/[,;\n]+/).map(x => x.trim()).filter(Boolean);
      if (!words.length) return;
      words.forEach(word => conn.send({ t: 'word', pollId: w.id, word, clientId: cid }));
      i.value = ''; i.focus();
    };
    document.getElementById('ws').onclick = send;
    document.getElementById('wi').onkeydown = e => e.key === 'Enter' && send();
  }
  const n = sent()[w.id] || 0, left = Infinity;
  document.getElementById('wi').disabled = document.getElementById('ws').disabled = !s.open;
  document.getElementById('wm').textContent = msg || (!s.open ? 'Les envois sont fermés.' : left === Infinity ? (n ? n + ' mot' + (n > 1 ? 's' : '') + ' envoyé' + (n > 1 ? 's' : '') + ' · continuez !' : 'Autant de mots que vous voulez') : left > 0 ? `Il vous reste ${left} mot${left > 1 ? 's' : ''}` : 'Merci ! Regardez l\'écran 👀');
}
const sent = () => JSON.parse(localStorage.sentWords || '{}');

function render() {
  if (!hostId) { app.innerHTML = '<p class="msg">Scannez le QR code affiché à l\'écran.</p>'; return; }
  if (!s) { app.innerHTML = '<p class="msg">Connexion…</p>'; return; }
  if (s.words) return renderWords();
  app.dataset.k = '';
  if (!s.poll) { app.innerHTML = '<h1>🧠 Vous êtes dans la machine !</h1><p class="msg">' + (s.intro ? 'La première question arrive…' : 'Regardez l\'écran 👀') + '</p>'; return; }
  const v = voted()[s.poll.id], has = v !== undefined;
  app.innerHTML = '<h1></h1>' + s.poll.options.map(() => '<button></button>').join('') + '<p class="msg"></p>';
  app.querySelector('h1').textContent = s.poll.question;
  app.querySelectorAll('button').forEach((b, i) => {
    b.textContent = s.poll.options[i];
    b.disabled = has || !s.open;
    if (v === i) b.className = 'sel';
    b.onclick = () => conn.send({ t: 'vote', pollId: s.poll.id, option: i, clientId: cid });
  });
  app.querySelector('.msg').textContent = has ? (msg || 'Vote enregistré.') : s.open ? 'Touchez votre choix' : 'Les votes sont fermés.';
}

function connect() {
  const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }, { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }] } });
  peer.on('open', () => {
    conn = peer.connect(hostId, { reliable: true });
    conn.on('data', d => {
      if (d.t === 'state') {
        s = d.state;
        if ((s.poll?.id ?? s.words?.id) !== lastPoll) { msg = ''; lastPoll = s.poll?.id ?? s.words?.id; }
        render();
      } else if (d.t === 'wack') {
        const m = sent();
        if (d.ok) { m[d.pollId] = d.count; msg = ''; }
        else { if (d.count != null) m[d.pollId] = d.count; msg = d.error === 'max' ? 'Vous avez envoyé tous vos mots.' : 'Mot refusé.'; }
        localStorage.sentWords = JSON.stringify(m);
        render();
      } else if (d.t === 'ack') {
        const v = voted();
        if (d.ok) { v[d.pollId] = d.option; msg = 'Merci, vote enregistré !'; }
        else if (d.error === 'dup') { v[d.pollId] = v[d.pollId] ?? -1; msg = 'Vous avez déjà voté.'; }
        else msg = 'Vote impossible.';
        localStorage.voted = JSON.stringify(v);
        render();
      }
    });
    conn.on('close', () => setTimeout(() => { peer.destroy(); s = null; render(); connect(); }, 1500));
  });
  peer.on('error', () => setTimeout(() => { peer.destroy(); connect(); }, 2000));
}
render();
if (hostId) connect();
setInterval(() => { if (hostId && !s) app.innerHTML = '<p class="msg">Connexion à l\'écran impossible pour l\'instant…<br>Vérifiez que la page du diaporama est ouverte sur l\'ordinateur (ou rechargez-la), puis patientez quelques secondes.</p>'; }, 8000);
</script></body></html>
