<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#12060a;--card:#2a0d14;--txt:#f8fafc;--mut:#a8a3b0;--a:#ef4444;--b:#f97316;--hl:#facc15}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font-family:system-ui,'Segoe UI',sans-serif;color:var(--txt);
 background:radial-gradient(60vw 60vh at 85% 10%,#7f1d1d66,transparent),radial-gradient(50vw 50vh at 5% 95%,#1e3a8a44,transparent),var(--bg)}

@keyframes in{from{opacity:0;transform:translateY(2vh)}to{opacity:1;transform:none}}
.kicker{font-size:1.5vw;letter-spacing:.25em;text-transform:uppercase;color:var(--b);margin-bottom:2vh;font-weight:600}
h1{font-size:5.6vw;line-height:1.05;margin:0 0 3vh;background:linear-gradient(90deg,#fff,#fecaca);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:3.4vw;line-height:1.15;margin:0 0 4vh}
.sub{font-size:2.2vw;color:var(--mut)}
.cols{display:flex;gap:4vw;align-items:center}
ul{list-style:none;margin:0;padding:0;flex:1}
li{font-size:2.2vw;line-height:1.35;margin:0 0 2.6vh;padding-left:2.4vw;position:relative;opacity:0;transform:translateX(-2vw);transition:.5s}
li::before{content:'';position:absolute;left:0;top:.6em;width:.9vw;height:.9vw;border-radius:50%;background:linear-gradient(135deg,var(--a),var(--b))}
li.show{opacity:1;transform:none}li b{color:var(--hl);font-weight:600}
.rcol{width:32vw;display:flex;flex-direction:column;gap:2vh;align-items:stretch}.vid{width:100%;aspect-ratio:16/9;border:0;border-radius:1vw}
.fig{margin:0;text-align:center}.fig img{width:100%;max-height:42vh;object-fit:contain;border-radius:1vw;background:#ffffff0d}.fig figcaption{font-size:1.1vw;color:var(--mut);margin-top:.8vh}
.srow{display:flex;gap:1vw}.rcol .stat{width:auto;flex:1;padding:2.5vh 1vw}.rcol .stat .v{font-size:3.2vw}.rcol .stat .l{font-size:1.3vw}.slide.red .kicker{color:#f87171}.fig img{max-height:30vh}.stat{width:30vw;background:var(--card);border:1px solid #ffffff18;border-radius:2vw;padding:4vh 2vw;text-align:center;opacity:0;transform:scale(.92);transition:.6s}
.stat.show{opacity:1;transform:none}
.stat .v{font-size:4.6vw;font-weight:800;background:linear-gradient(90deg,var(--hl),#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat .l{font-size:1.5vw;color:var(--mut);margin-top:1.5vh}
.src{position:absolute;left:6vw;right:6vw;bottom:7vh;font-size:1.1vw;color:#78716c}
.slide.title,.slide.end,.slide.qr{align-items:center;text-align:center}
.slide.title h1{font-size:6.2vw}.author{margin-top:5vh;font-size:1.8vw;color:var(--mut)}
.qrbox{background:#fff;border-radius:2vw;padding:1.2vw;height:52vh;aspect-ratio:1;margin:2vh 0}.qrbox svg{width:100%;height:100%;display:block}
.slide.qr h1{font-size:4.4vw;margin-bottom:1vh}.url{font-size:1.4vw;color:var(--mut);word-break:break-all}
.cnt{font-size:2.2vw;color:var(--b);margin-top:1vh;font-weight:600}
.pollwrap{display:flex;gap:4vw;flex:1;min-height:0}.pollmain{flex:1;display:flex;flex-direction:column;min-height:0}.pollside{width:24vw;text-align:center;font-size:1.3vw;color:var(--mut)}
.pollside .qrbox{height:auto;width:100%;padding:.7vw;border-radius:1.2vw}
.slide.cloud{justify-content:flex-start;padding-top:5vh}
.slide.cloud h2{font-size:2.8vw;margin-bottom:1vh}
#cloud{position:absolute;inset:0;overflow:hidden;z-index:0}.slide.cloud>*:not(.pollwrap){position:relative;z-index:2;pointer-events:none;text-shadow:0 0 1.5vw #000}.pollwrap{position:static}.pollmain{position:static}.pollside{position:absolute;right:3vw;bottom:10vh;width:16vw;z-index:2;background:#0008;padding:1vw;border-radius:1.5vw}.tot{position:absolute;left:6vw;bottom:8vh;z-index:2;pointer-events:none}
#cloud span{position:absolute;left:0;top:0;font-weight:800;line-height:1;white-space:nowrap;cursor:pointer;will-change:transform;text-shadow:0 0 .8vw currentColor;transition:font-size .6s,filter .4s}
#cloud span i{display:inline-block;font-style:normal;animation:pop .8s cubic-bezier(.2,1.4,.4,1) both}
#cloud span.fresh i{animation:pop .8s cubic-bezier(.2,1.4,.4,1) both,flash 1.6s ease-out}
#cloud span.spot{filter:brightness(1.6) drop-shadow(0 0 1.2vw currentColor);z-index:2}
@keyframes float{0%{transform:translate(0,0) rotate(var(--r,-2deg))}100%{transform:translate(var(--x,.6vw),var(--y,-1.2vh)) rotate(calc(var(--r,-2deg) * -1))}}
@keyframes flash{0%{filter:brightness(3) drop-shadow(0 0 2vw #fff)}100%{filter:none}}
@keyframes pop{from{opacity:0;transform:scale(.2) rotate(-8deg)}to{opacity:1;transform:none}}
.tot{font-size:1.6vw;color:var(--mut)}
#bar{position:fixed;left:50%;bottom:2vh;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);padding:9px;display:flex;align-items:center;gap:10px;background:#090b14eF;border:1px solid #ffffff20;border-radius:16px;box-shadow:0 12px 40px #0008;backdrop-filter:blur(16px);z-index:5}
#bar .controls,#bar .tools{display:flex;align-items:center;gap:6px}
#bar button{min-height:40px;padding:8px 12px;border:1px solid #ffffff20;border-radius:10px;background:#ffffff0b;color:var(--txt);font:600 .9rem system-ui;cursor:pointer;transition:background .18s,border-color .18s,transform .18s}
#bar button:hover{background:#ffffff1a;border-color:#ffffff45;transform:translateY(-1px)}
#bar button:active{transform:translateY(0)}
#bar button:focus-visible{outline:2px solid var(--hl);outline-offset:2px}
#bar #prev,#bar #next{width:42px;padding:8px;font-size:1.05rem}
#bar #next{background:#f97316;color:#1b0c08;border-color:#fb923c}
#bar .divider{height:28px;width:1px;background:#ffffff20}
#bar .info{color:#cbd5e1;font-size:.78rem;line-height:1.35;white-space:nowrap}
#bar #n{font-variant-numeric:tabular-nums;font-weight:650}
@media(max-width:760px){#bar{bottom:8px;max-width:calc(100vw - 16px);padding:6px;gap:6px;border-radius:12px}#bar .controls,#bar .tools{gap:4px}#bar button{min-height:36px;padding:6px 8px;font-size:.78rem}#bar #prev,#bar #next{width:36px}#bar .info{font-size:.68rem}#bar .hint{display:none}}
body{--o1:#1e3a8a;--o2:#b45309}
body.dusk{--o1:#6d28d9;--o2:#b91c1c}body.red{--o1:#991b1b;--o2:#7c2d12}
.orb{position:fixed;border-radius:50%;filter:blur(9vw);opacity:.45;pointer-events:none;transition:background 1.6s;z-index:-1}
#o1{width:45vw;height:45vw;left:-10vw;top:-10vw;background:var(--o1);animation:drift1 18s ease-in-out infinite alternate}
#o2{width:40vw;height:40vw;right:-8vw;bottom:-10vw;background:var(--o2);animation:drift2 22s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(30vw,25vh) scale(1.25)}}@keyframes drift2{to{transform:translate(-28vw,-20vh) scale(1.3)}}
body.red .slide,body.dusk .slide{--hl:#fca5a5}
body.red::after{content:'';position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 12vw #7f1d1d}
@keyframes beat{50%{box-shadow:inset 0 0 18vw #b91c1c}}
.ch{display:inline-block;-webkit-text-fill-color:#fee2e2;opacity:0;transform:translateY(5vh) rotate(6deg);animation:ch .7s cubic-bezier(.2,1.3,.4,1) forwards;animation-delay:calc(var(--i)*60ms + .2s)}
@keyframes ch{to{opacity:1;transform:none}}
.slide.title .sub{opacity:0;animation:in 1s ease 1.2s forwards}
.slide.title .kicker{animation:in 1s ease}
.slide.big{align-items:center;text-align:center;animation:zoom .7s ease}.slide.content{animation:in .6s ease}
@keyframes zoom{from{opacity:0;transform:scale(1.06);filter:blur(1vw)}to{opacity:1;transform:none;filter:none}}
.bigbox{display:flex;flex-direction:column;gap:3.2vh;align-items:center;max-width:82vw;margin:0 auto}.slide.big,.slide.static,.slide.title,.slide.end{align-items:center;text-align:center}.slide.big .kicker,.slide.static .kicker,.slide.title .kicker{margin-bottom:4vh}
.bl{font-size:3.2vw;line-height:1.25;opacity:0;transform:translateY(3vh) scale(.96);filter:blur(.8vw);transition:all .9s cubic-bezier(.2,.8,.2,1)}
.bl.show{opacity:1;transform:none;filter:none}.bl.show.old{opacity:.62}
.bl b{color:var(--hl)}.bl.sm{font-size:2.3vw;color:#e2e8f0}.bl.em{font-size:4vw;font-weight:800;background:linear-gradient(90deg,#fff,var(--hl));-webkit-background-clip:text;background-clip:text;color:transparent}
.bl.em b{-webkit-text-fill-color:var(--hl)}.bl.show.em.old{opacity:1}
.bl .vid{width:46vw}
.stat.show .v{animation:glow 2.4s ease-in-out infinite alternate}@keyframes glow{to{filter:drop-shadow(0 0 1vw #facc15)}}
.stat .v.long{font-size:2.2vw!important}
li.show::before{animation:ping 1.2s ease-out}@keyframes ping{0%{box-shadow:0 0 0 0 #ef4444aa}100%{box-shadow:0 0 0 1.2vw transparent}}
.fig img,.vid{animation:in .8s ease}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.ch,.slide.title .sub{opacity:1!important;transform:none!important}}
.slide.static{animation:none;align-items:center;text-align:center;gap:3vh}.slide.static p{font-size:2.5vw;line-height:1.35;margin:0 0 2.5vh;max-width:80vw;color:#e2e8f0}.slide.static b{color:var(--hl)}.slide.static p:last-child{font-size:3.4vw}
</style></head><body>
<div class="orb" id="o1"></div><div class="orb" id="o2"></div><div id="prog"></div>
<section id="slide" class="slide"></section>
<div id="bar">
  <div class="controls">
    <button id="prev" title="Diapositive précédente" aria-label="Diapositive précédente">←</button>
    <span class="info" id="n"></span>
    <button id="next" title="Diapositive suivante" aria-label="Diapositive suivante">→</button>
  </div>
  <span class="divider"></span>
  <div class="tools">
    <button id="toggle"></button>
    <button id="reset">Effacer les mots</button>
    <button id="full">⛶ Plein écran</button>
  </div>
  <span class="divider hint"></span>
  <span class="info hint">← → avancer · Espace envois · F plein écran · Q QR/image</span>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
const $ = id => document.getElementById(id);

const slides = [
  { kind: 'title', mood: 'calm', kicker: 'Exposé', title: 'Le bonheur a-t-il un prix ?', sub: 'Qu\'est-ce qui garantit notre bonheur ?' },
  { kind: 'big', mood: 'calm', kicker: 'Une question vieille comme la philosophie', lines: [
    'Qu\'est-ce qu\'une vie heureuse ?',
    { t: 'Aristote : l\'<b>eudaimonia</b>, bien vivre en épanouissant ce qui fait de nous des humains', cls: 'sm' },
    { t: 'Épicure : l\'<b>ataraxie</b>, la tranquillité de l\'âme, sans trouble ni crainte', cls: 'sm' },
    { t: 'Alors, <b>qu\'est-ce qui nous rend heureux</b> ?', cls: 'em' } ] },
  { kind: 'cloud', mood: 'calm', id: 'w1', max: 0, question: 'Selon vous, qu\'est-ce qui vous rend heureux ?', hint: 'Envoyez autant de mots que vous voulez !' },
  { kind: 'big', mood: 'calm', kicker: 'Une expérience de pensée', lines: [
    'Imaginez une nation qui semble avoir trouvé la solution.',
    { t: 'Ses dirigeants promettent <b>la paix et la prospérité</b>…', cls: 'sm' },
    { t: '…et affirment avoir <b>tenu leur promesse</b>.', cls: 'em' } ] },
  { kind: 'content', mood: 'calm', kicker: 'L\'utopie promise', title: 'Une nation sans crise ?',
    bullets: ["Le régime annonce un chômage inférieur à <b>1 %</b>", "Il affirme que la criminalité est tombée sous <b>1 %</b>", "Il présente les <b>364 jours</b> hors Purge comme une période de paix et de prospérité", "Ce sont les chiffres du régime : suffisent-ils à prouver que la population est heureuse ?"],
    stats: [{ v: 'moins de 1 %', l: 'de chômage, selon le régime' }, { v: 'moins de 1 %', l: 'de criminalité, selon le régime' }, { v: '364', l: 'jours hors Purge par an' }] },
  { kind: 'big', mood: 'dusk', kicker: 'Derrière la façade', lines: [
    { t: 'Tout semble tenir.', cls: 'em' },
    { t: '364 jours de paix. 364 jours de prospérité.', cls: 'sm' },
    { t: 'Mais une façade parfaite ne dit rien de ses fondations.', cls: 'sm' },
    { t: 'Et si quelque chose se cachait derrière cette promesse ?', cls: 'em' } ] },
  { kind: 'content', mood: 'dusk', kicker: 'Le contrat', title: 'Le prix du 365e jour',
    bullets: ["Une fois par an, pendant <b>12 heures</b>, la loi est suspendue", "Toute violence, <b>meurtre compris</b>, devient légale", "Les services d'urgence sont suspendus", "Le régime présente cette nuit comme un <b>exutoire</b> et un <b>sacrifice civique</b>", "La paix promise a donc une contrepartie : <b>qui en paie le prix ?</b>"],
    stat: { v: '12 h', l: 'sans protection de la loi, le 365e jour' } },
  { kind: 'big', mood: 'red', kicker: 'Cette société n\'existe pas… heureusement', lines: [
    { t: 'Elle vient d\'un film : <b>American Nightmare</b>', cls: 'em' },
    { t: '<i>The Purge</i>, réalisé par James DeMonaco (2013)', cls: 'sm' },
    { t: 'Une fiction peut servir d\'<b>expérience de pensée</b> : que vaut une sécurité qui dépend de la violence ?', cls: 'sm' } ] },
  { kind: 'content', mood: 'red', kicker: 'Première fracture', title: 'La sécurité devient un produit de luxe',
    bullets: ["Les plus <b>riches</b> peuvent s'équiper et protéger leur foyer", "Les plus <b>pauvres</b>, moins protégés, sont davantage exposés à la violence", "La sécurité dépend alors des moyens de chacun, au lieu d'être <b>garantie à tous</b>"],
    stat: { v: 'Droit ou privilège ?', l: 'qui peut acheter sa protection ?' } },
  { kind: 'content', mood: 'red', kicker: 'Seconde fracture', title: 'Ce que la sécurité absolue détruit',
    bullets: ["La menace permanente rend la <b>confiance</b> difficile", "Se barricader protège un foyer, mais peut aussi renforcer l'<b>isolement</b>", "La violence tolérée banalise la souffrance d'autrui et fragilise l'<b>empathie</b>", "Rester en vie ne suffit pas à <b>vivre heureux</b>"],
    stat: { v: 'Survivre ≠ vivre', l: 'la peur et l\'isolement ont aussi un coût' } },
  { kind: 'content', mood: 'calm', kicker: 'Retour au réel', title: 'De quoi avons-nous besoin pour être heureux ?',
    bullets: ["Manger, dormir et disposer d'un toit répondent à des <b>besoins essentiels</b>", "La <b>sécurité</b> aide à vivre sans menace constante, mais ne suffit pas", "Pour s'épanouir, il faut aussi des <b>liens</b>, de la liberté et la possibilité d'agir", "La hiérarchie proposée par Maslow est un <b>modèle de réflexion</b>, pas une règle universelle"],
    src: 'Abraham Maslow, « A Theory of Human Motivation », Psychological Review, 1943.' },
  { kind: 'content', mood: 'calm', kicker: 'Justice', title: 'Qui paie le prix de cette sécurité ?',
    bullets: ["Rawls propose d'imaginer les règles d'une société <b>sans savoir quelle place on y occupera</b>", "Accepterions-nous ce système sans savoir si nous serons protégés ou exposés ?", "Une sécurité qui protège certains en sacrifiant les autres n'est pas une <b>sécurité juste</b>", "Cette question nous ramène à la vôtre : <b>qu'est-ce qui rend vraiment heureux ?</b>"],
    src: 'John Rawls, A Theory of Justice, 1971.' },
  { kind: 'cloud', mood: 'calm', id: 'w1', max: 0, readonly: true, question: 'Revenons à vos mots du début…', hint: '' },
  { kind: 'static', mood: 'calm', kicker: 'Un petit rappel', lines: [
    'Vos mots rappellent que le bonheur ne se réduit pas à survivre : il tient aussi aux <b>liens</b>, à la liberté et aux projets.',
    'Un toit, de quoi manger, la sécurité : ce qui nous semble <b>acquis</b> dépend aussi du lieu et des circonstances dans lesquels on naît.',
    'Pour des peuples <b>opprimés</b>, des personnes en guerre ou contraintes à l\'exil, ces besoins restent une urgence quotidienne.',
    '<b>Ne les oublions pas.</b>' ] },
  { kind: 'big', mood: 'calm', kicker: 'Conclusion', lines: [
    { t: 'La <b>sécurité</b> est nécessaire pour satisfaire nos besoins et nous épanouir.', cls: 'sm' },
    { t: 'Mais elle ne suffit <b>pas à garantir le bonheur</b>.', cls: 'sm' },
    { t: 'Si elle repose sur l\'injustice, la privation de liberté et la rupture des liens humains, <b>son coût est trop élevé</b>.', cls: 'sm' },
    { t: 'Le bonheur ne peut pas se construire <b>au prix de l\'humanité des autres</b>.', cls: 'em' } ] },
  { kind: 'end', mood: 'calm', title: 'Merci !' },
];

const state = Object.assign({ cur: 0, step: 0, open: true, words: {}, wvoters: {}, ver: {} }, JSON.parse(localStorage.deck2 || 'null') || {});
state.cur = Math.min(state.cur, slides.length - 1);
const save = () => localStorage.deck2 = JSON.stringify(state);
const S = () => slides[state.cur];
const statsOf = s => s.stats || (s.stat ? [s.stat] : []);
const maxStep = s => s.kind === 'content' ? (s.bullets?.length || 0) + statsOf(s).length : s.kind === 'big' ? s.lines.length + (s.video ? 1 : 0) : 0;
const wid = s => s.id + '.' + (state.ver[s.id] || 0);

const view = () => {
  const s = S();
  return { intro: s.kind === 'qr', poll: null, open: state.open,
    words: s.kind === 'cloud' && !s.readonly ? { id: wid(s), question: s.question, max: s.max } : null };
};

const hostId = 'diapo-bonheur-7k3q9x2m';
const voterUrl = new URL('./?h=' + hostId, location.href).href;
const qr = qrcode(0, 'M'); qr.addData(voterUrl); qr.make();
const qrSvg = qr.createSvgTag({ scalable: true, margin: 0 });

const conns = new Set();
const broadcast = () => { const m = { t: 'state', state: view() }; conns.forEach(c => c.open && c.send(m)); };

function render() {
  const s = S(), el = $('slide');
  el.className = 'slide ' + s.kind;
  document.body.className = s.mood || '';
  if ($('qro')) $('qro').style.display = 'none';
  const kick = s.kicker ? `<div class="kicker">${s.kicker}</div>` : '';
  const lines = (s.lines || []).map(l => typeof l === 'string' ? { t: l } : l);
  if (s.kind === 'qr') el.innerHTML = `<h1>🔒 Rejoignez la discussion</h1><div class="sub">Scannez le QR code pour participer depuis votre téléphone</div><div class="qrbox">${qrSvg}</div><div class="url">${voterUrl}</div><div class="cnt" id="cnt"></div>`;
  else if (s.kind === 'title') el.innerHTML = `${kick}<h1>${[...s.title].map((c, i) => `<span class="ch" style="--i:${i}">${c === ' ' ? '&nbsp;' : c}</span>`).join('')}</h1>${s.sub ? `<div class="sub">${s.sub}</div>` : ""}`;
  else if (s.kind === 'static') el.innerHTML = `${kick}${lines.map(l => `<p>${l.t}</p>`).join('')}`;
  else if (s.kind === 'big') el.innerHTML = `${kick}<div class="bigbox">${lines.map(l => `<div class="bl ${l.cls || ''}">${l.t}</div>`).join('')}${s.video ? `<div class="bl"><iframe class="vid" src="https://www.youtube-nocookie.com/embed/${s.video}" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe></div>` : ''}</div>`;
  else if (s.kind === 'end') el.innerHTML = `<h1>${s.title}</h1>${s.sub ? `<div class="sub">${s.sub}</div>` : ""}`;
  else if (s.kind === 'content') el.innerHTML = `${kick}<h2>${s.title}</h2><div class="cols"><ul>${(s.bullets || []).map(b => `<li>${b}</li>`).join('')}</ul>`
    + ((statsOf(s).length || s.img || s.video) ? `<div class="rcol">${s.video ? `<iframe class="vid" src="https://www.youtube-nocookie.com/embed/${s.video}" allowfullscreen allow="encrypted-media; picture-in-picture"></iframe>` : ""}${s.img ? `<figure class="fig"><img src="${s.img}" alt=""><figcaption>${s.cap || ""}</figcaption></figure>` : ""}${statsOf(s).length ? `<div class="srow">${statsOf(s).map(x => `<div class="stat"><div class="v">${x.v}</div><div class="l">${x.l}</div></div>`).join("")}</div>` : ""}</div>` : "") + `</div>` + (s.src ? `<div class="src">${s.src}</div>` : '');
  else if (s.kind === 'cloud') {
    el.innerHTML = `<div class="kicker">${s.readonly ? 'Nuage de mots de la classe' : 'À vous : envoyez vos mots'}</div><h2></h2><div class="pollwrap"><div class="pollmain"><div id="cloud"></div><div class="tot" id="tot"></div></div>`
      + (s.readonly ? '' : `<div class="pollside"><div>Scannez pour répondre</div><div class="qrbox">${qrSvg}</div><div>${s.hint}</div></div>`) + `</div>`;
    el.querySelector('h2').textContent = s.question;
  }
  $('prog').style.width = (state.cur + 1) / slides.length * 100 + '%';
}

const colors = ['#f87171', '#fb923c', '#facc15', '#4ade80', '#22d3ee', '#818cf8', '#e879f9', '#f472b6'];
const hash = w => [...w].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
const cloudItems = new Map();
let raf = 0, spotTimer = 0;
function loop() {
  const c = $('cloud');
  if (!c) { raf = 0; return; }
  const W = c.clientWidth, H = c.clientHeight;
  cloudItems.forEach((it, el) => {
    if (!el.isConnected) { cloudItems.delete(el); return; }
    const w = el.offsetWidth, h = el.offsetHeight;
    it.x += it.vx; it.y += it.vy;
    if (it.x < 0) { it.x = 0; it.vx = Math.abs(it.vx); } else if (it.x > W - w) { it.x = Math.max(0, W - w); it.vx = -Math.abs(it.vx); }
    if (it.y < 0) { it.y = 0; it.vy = Math.abs(it.vy); } else if (it.y > H - h) { it.y = Math.max(0, H - h); it.vy = -Math.abs(it.vy); }
    it.a += it.va;
    el.style.transform = `translate(${it.x}px,${it.y}px) rotate(${Math.sin(it.a) * 6}deg)`;
  });
  raf = requestAnimationFrame(loop);
}
function drawCloud(s) {
  const cloud = $('cloud'), w = state.words[s.id] || {};
  const first = !cloud.children.length;
  const entries = Object.entries(w), max = Math.max(1, ...entries.map(e => e[1])), total = entries.reduce((a, e) => a + e[1], 0);
  const base = entries.length > 80 ? 1.2 : entries.length > 50 ? 1.5 : entries.length > 30 ? 1.9 : entries.length > 15 ? 2.5 : entries.length > 6 ? 3.2 : 4;
  const present = new Set(entries.map(e => e[0]));
  [...cloud.children].forEach(c => { if (!present.has(c.dataset.w)) { cloudItems.delete(c); c.remove(); } });
  const W = cloud.clientWidth || 800, H = cloud.clientHeight || 400;
  entries.forEach(([word, n]) => {
    let sp = [...cloud.children].find(c => c.dataset.w === word);
    if (!sp) {
      sp = document.createElement('span'); sp.dataset.w = word;
      const i = document.createElement('i'); i.textContent = word; sp.appendChild(i);
      sp.style.color = colors[hash(word) % colors.length];
      sp.title = 'Cliquer pour retirer ce mot';
      const sx = (Math.random() * 0.5 + 0.25) * (Math.random() < .5 ? -1 : 1), sy = (Math.random() * 0.4 + 0.15) * (Math.random() < .5 ? -1 : 1);
      cloudItems.set(sp, { x: Math.random() * W * .8, y: Math.random() * H * .8, vx: sx, vy: sy, a: Math.random() * 6, va: .01 + Math.random() * .02 });
      if (!first) { sp.classList.add('fresh'); setTimeout(() => sp.classList.remove('fresh'), 1700); }
      sp.onclick = () => { delete state.words[s.id][word]; update(); };
      cloud.appendChild(sp);
    }
    sp.style.fontSize = (base + Math.min(n - 1, 12) * base * .25) + 'vw';
  });
  $('tot').textContent = `${total} mot${total > 1 ? 's' : ''} envoyé${total > 1 ? 's' : ''}` + (!s.readonly && !state.open ? ' · envois fermés' : '');
  if (!raf) raf = requestAnimationFrame(loop);
  if (!spotTimer) spotTimer = setInterval(() => {
    const sp = [...document.querySelectorAll('#cloud span')];
    sp.forEach(x => x.classList.remove('spot'));
    if (sp.length) sp[Math.floor(Math.random() * sp.length)].classList.add('spot');
  }, 2200);
}

function countUp(v) {
  v.dataset.t ||= v.textContent;
  const m = v.dataset.t.match(/^(\d+)(.*)$/);
  if (!m) return;
  const end = +m[1], t0 = performance.now();
  const f = now => { const k = Math.min(1, (now - t0) / 1400); v.textContent = Math.round(end * (1 - Math.pow(1 - k, 3))) + m[2]; if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function draw() {
  const s = S();
  $('toggle').textContent = state.open ? '⏸ Fermer les envois' : '▶ Ouvrir les envois';
  $('n').textContent = `${state.cur + 1}/${slides.length} · ${window.peerStatus || '⏳ connexion…'} · ${conns.size} connecté(s)`;
  if ($('cnt')) $('cnt').textContent = conns.size + ' personne' + (conns.size > 1 ? 's' : '') + ' connectée' + (conns.size > 1 ? 's' : '');
  if (s.kind === 'content') {
    const n = s.bullets?.length || 0;
    document.querySelectorAll('li').forEach((li, i) => li.classList.toggle('show', i < state.step));
    document.querySelectorAll('.stat').forEach((el, i) => {
      const on = state.step > n + i, v = el.querySelector('.v');
      el.classList.toggle('show', on);
      if (v.textContent.length > 8) v.classList.add('long');
      if (on && !el.dataset.done) { el.dataset.done = 1; countUp(v); }
      if (!on) { delete el.dataset.done; if (v.dataset.t) v.textContent = v.dataset.t; }
    });
  }
  if (s.kind === 'big') {
    const bl = [...document.querySelectorAll('.bl')];
    bl.forEach((el, i) => { el.classList.toggle('show', i < state.step); el.classList.toggle('old', i < state.step - 1); });
  }
  if (s.kind === 'cloud') drawCloud(s);
}
const update = () => { save(); draw(); broadcast(); };
const changed = () => { render(); update(); };
const next = () => {
  if (state.step < maxStep(S())) { state.step++; update(); }
  else if (state.cur < slides.length - 1) { state.cur++; state.step = 0; changed(); }
};
const prev = () => {
  if (state.step > 0 && S().kind === 'content') { state.step--; update(); }
  else if (state.cur > 0) { state.cur--; state.step = maxStep(S()); changed(); }
};

function onWord(conn, d) {
  const s = S(), err = (e, count) => conn.send({ t: 'wack', ok: false, error: e, pollId: d.pollId, count });
  if (s.kind !== 'cloud' || s.readonly || wid(s) !== d.pollId || !state.open || !d.clientId) return err('refused');
  const word = String(d.word || '').toLowerCase().replace(/\s+/g, ' ').trim().slice(0, 40);
  if (!word) return err('refused');
  const vs = state.wvoters[wid(s)] ||= {}, used = vs[d.clientId] || 0;
  vs[d.clientId] = used + 1;
  const w = state.words[s.id] ||= {};
  w[word] = (w[word] || 0) + 1;
  conn.send({ t: 'wack', ok: true, pollId: d.pollId, count: used + 1 });
  update();
}

function startPeer() {
  const peer = new Peer(hostId);
  const st = t => { const n = $('n'); window.peerStatus = t; n.dataset.p = t; draw(); };
  peer.on('open', () => st('🟢 en ligne'));
  peer.on('connection', conn => {
    conn.on('open', () => { conns.add(conn); conn.send({ t: 'state', state: view() }); draw(); });
    conn.on('data', d => d.t === 'word' && onWord(conn, d));
    conn.on('close', () => { conns.delete(conn); draw(); });
  });
  peer.on('disconnected', () => peer.reconnect());
  peer.on('error', e => {
    if (e.type === 'unavailable-id') { st('🟠 identifiant occupé, nouvel essai…'); peer.destroy(); setTimeout(startPeer, 4000); }
    else st('🔴 ' + e.type);
  });
}

$('prev').onclick = prev; $('next').onclick = next;
$('toggle').onclick = () => { state.open = !state.open; update(); };
$('reset').onclick = () => {
  const s = S();
  if (s.kind !== 'cloud') return alert('Placez-vous sur la diapo du nuage de mots pour le remettre à zéro.');
  if (!confirm('Effacer tous les mots ?')) return;
  delete state.words[s.id]; delete state.wvoters[wid(s)];
  state.ver[s.id] = (state.ver[s.id] || 0) + 1;
  $('cloud').innerHTML = '';
  update();
};
$('full').onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
addEventListener('keydown', e => {
  if (['ArrowRight', 'PageDown', 'Enter'].includes(e.key)) next();
  else if (['ArrowLeft', 'PageUp'].includes(e.key)) prev();
  else if (e.key === ' ') { e.preventDefault(); $('toggle').click(); }
  else if (e.key.toLowerCase() === 'f') $('full').click();
  else if (e.key.toLowerCase() === 'q') {
    let o = $('qro');
    if (!o) {
      o = document.createElement('div'); o.id = 'qro';
      o.style.cssText = 'position:fixed;inset:0;z-index:9;background:#000d;display:none;align-items:center;justify-content:center';
      o.onclick = () => o.style.display = 'none';
      document.body.appendChild(o);
    }
    if (o.style.display === 'flex') { o.style.display = 'none'; return; }
    const s = S();
    o.innerHTML = s.img
      ? `<img src="${s.img}" alt="" style="max-width:92vw;max-height:92vh;object-fit:contain;border-radius:1vw;background:#fff">`
      : `<div class="qrbox" style="height:80vh">${qrSvg}</div>`;
    o.style.display = 'flex';
  }
});

render(); draw(); startPeer();
</script></body></html>
