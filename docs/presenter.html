<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script d'oral · Le bonheur a-t-il un prix ?</title>
<style>
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#14161c;color:#f2f0ea;font-family:system-ui,Segoe UI,Arial,sans-serif;display:flex;flex-direction:column}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 18px;background:#1d2029;font-size:15px}
#st{opacity:.85;text-align:right}
main{flex:1;overflow-y:auto;padding:18px 6vw 30px;max-width:1000px;margin:0 auto;width:100%;scroll-behavior:smooth}
h1{font-size:clamp(20px,3vw,30px);margin:6px 0 16px;color:#f5c518}
.seg{font-size:clamp(20px,3.2vw,34px);line-height:1.45;margin:0 0 16px;padding:10px 14px;border-left:5px solid transparent;border-radius:6px;opacity:.5;transition:opacity .2s}
.seg.done{opacity:.28}
.seg.act{opacity:1;background:#1f2330;border-left-color:#f5c518}
.seg.free{opacity:.85}
.seg g{color:#f5c518;font-weight:700}
.seg b{color:#fff}
.nx{margin-top:20px;font-size:clamp(14px,2vw,18px);opacity:.6}
footer{display:flex;gap:10px;padding:12px 18px;background:#1d2029}
button{font-size:20px;padding:18px 10px;border:0;border-radius:12px;background:#2c3142;color:#fff}
#pv{flex:1}#fl{flex:1.2;font-size:16px}#nxb{flex:2.4;background:#f5c518;color:#14161c;font-weight:700}
#fl.on{background:#2f6b3f}
</style>
</head>
<body>
<header><span id="n">…</span><span id="st">⏳ connexion au PC…</span></header>
<main id="m"><h1 id="h"></h1><div id="segs"></div><div class="nx" id="nx"></div></main>
<footer><button id="pv">◀</button><button id="fl" class="on">Pilote le PC</button><button id="nxb">Suivant ▶</button></footer>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
/* Un segment par étape du PC : le segment 0 se dit avant la première apparition ;
   chaque segment suivant commence par un mot en <g> (doré) = appuyer sur Suivant en le disant. */
const notes = [
  ['Titre', ['Bonjour. Notre question : <b>le bonheur a-t-il un prix ?</b> Qu\'est-ce qui garantit notre bonheur ?']],
  ['Une question vieille comme la philosophie', [
    'Les philosophes se posent cette question depuis l\'Antiquité.',
    '<g>Qu\'est-ce qu\'une vie</g> heureuse ?',
    '<g>Pour Aristote,</g> c\'est l\'<b>eudaimonia</b> : bien vivre, en épanouissant ce qui fait de nous des humains.',
    '<g>Pour Épicure,</g> c\'est l\'<b>ataraxie</b> : la tranquillité de l\'âme, sans trouble ni crainte.',
    '<g>Alors,</g> qu\'est-ce qui nous rend heureux ?']],
  ['Nuage de mots (le public participe)', ['Scannez le QR code et envoyez autant de mots que vous voulez : selon vous, qu\'est-ce qui vous rend heureux ? <i>(laisser 1 min ; lire quelques mots à voix haute.)</i>']],
  ['Une expérience de pensée', [
    'Changeons de point de vue.',
    '<g>Imaginez une nation</g> qui semble avoir trouvé la solution.',
    '<g>Ses dirigeants promettent</g> la paix et la prospérité…',
    '<g>…et affirment</g> avoir tenu leur promesse.']],
  ['Une nation sans crise ?', [
    'Regardons cette nation de plus près.',
    '<g>Le régime annonce</g> un chômage inférieur à 1 %.',
    '<g>Il affirme que</g> la criminalité est tombée sous 1 %.',
    '<g>Il présente les 364 jours</g> hors Purge comme une période de paix et de prospérité.',
    '<g>Mais ce sont</g> les chiffres du régime : suffisent-ils à prouver que la population est heureuse ?',
    '<g>Moins de 1 % de chômage,</g> selon le régime.',
    '<g>Moins de 1 % de criminalité,</g> selon le régime.',
    '<g>364 jours</g> de paix par an… en apparence.']],
  ['Derrière la façade', [
    'Tout semble parfait.',
    '<g>Tout semble tenir.</g>',
    '<g>364 jours de paix,</g> 364 jours de prospérité.',
    '<g>Mais une façade parfaite</g> ne dit rien de ses fondations.',
    '<g>Et si quelque chose</g> se cachait derrière cette promesse ?']],
  ['Le prix du 365e jour', [
    'Voici le contrat.',
    '<g>Une fois par an,</g> pendant 12 heures, la loi est suspendue.',
    '<g>Toute violence,</g> meurtre compris, devient légale.',
    '<g>Les services d\'urgence</g> sont suspendus.',
    '<g>Le régime présente</g> cette nuit comme un exutoire et un sacrifice civique.',
    '<g>La paix promise</g> a donc une contrepartie : <b>qui en paie le prix ?</b>',
    '<g>12 heures</g> sans protection de la loi, le 365e jour.']],
  ['Révélation : American Nightmare', [
    'Cette société vous semble familière ?',
    '<g>Elle vient d\'un film :</g> <i>American Nightmare</i>. Elle n\'existe pas, heureusement.',
    '<g><i>The Purge</i>,</g> réalisé par James DeMonaco, en 2013.',
    '<g>Une fiction peut servir</g> d\'expérience de pensée : que vaut une sécurité qui dépend de la violence ?']],
  ['Première fracture', [
    'Première fracture : la sécurité devient un produit de luxe.',
    '<g>Les plus riches</g> peuvent s\'équiper et protéger leur foyer.',
    '<g>Les plus pauvres,</g> moins protégés, sont davantage exposés.',
    '<g>La sécurité dépend</g> alors des moyens de chacun, au lieu d\'être garantie à tous.',
    '<g>Droit ou privilège ?</g> Qui peut acheter sa protection ?']],
  ['Seconde fracture', [
    'Seconde fracture : ce que la sécurité absolue détruit.',
    '<g>La menace permanente</g> rend la confiance difficile.',
    '<g>Se barricader</g> protège un foyer, mais peut renforcer l\'isolement.',
    '<g>La violence tolérée</g> banalise la souffrance d\'autrui et fragilise l\'empathie.',
    '<g>Rester en vie</g> ne suffit pas à vivre heureux.',
    '<g>Survivre n\'est pas vivre :</g> la peur et l\'isolement ont aussi un coût.']],
  ['Retour au réel : de quoi a-t-on besoin ?', [
    'Revenons au réel : de quoi avons-nous besoin pour être heureux ?',
    '<g>Manger, dormir,</g> avoir un toit : des besoins essentiels.',
    '<g>La sécurité</g> aide à vivre sans menace constante, mais ne suffit pas.',
    '<g>Pour s\'épanouir,</g> il faut aussi des liens, de la liberté et la possibilité d\'agir.',
    '<g>La pyramide de Maslow</g> est un <b>modèle de réflexion</b>, pas une règle universelle.']],
  ['Justice : qui paie le prix ?', [
    'Qui paie le prix de cette sécurité ?',
    '<g>Rawls propose</g> d\'imaginer les règles d\'une société sans savoir quelle place on y occupera.',
    '<g>Accepterions-nous</g> ce système sans savoir si nous serons protégés ou exposés ?',
    '<g>Une sécurité qui protège</g> certains en sacrifiant les autres n\'est pas une sécurité juste.',
    '<g>Cela nous ramène</g> à votre question : qu\'est-ce qui rend vraiment heureux ?']],
  ['Retour au nuage de mots', ['Revenons à vos mots du début… <i>(commenter 2 ou 3 mots : liens, liberté, famille, etc. selon ce qui ressort.)</i>']],
  ['Un petit rappel (sans animation)', ['<g>Vos mots rappellent</g> que le bonheur ne se réduit pas à survivre : il tient aussi aux liens, à la liberté et aux projets. Un toit, de quoi manger, la sécurité : ce qui nous semble acquis dépend aussi du lieu et des circonstances dans lesquels on naît. Pour des peuples opprimés, des personnes en guerre ou contraintes à l\'exil, ces besoins restent une urgence quotidienne. <b>Ne les oublions pas.</b>']],
  ['Conclusion', [
    'Pour conclure.',
    '<g>La sécurité est nécessaire</g> pour satisfaire nos besoins et nous épanouir.',
    '<g>Mais elle ne suffit pas</g> à garantir le bonheur.',
    '<g>Si elle repose</g> sur l\'injustice, la privation de liberté et la rupture des liens humains, son coût est trop élevé.',
    '<g>Le bonheur ne peut pas</g> se construire au prix de l\'humanité des autres.']],
  ['Merci !', ['Merci de votre attention. Des questions ?']]
];
const hostId = 'diapo-bonheur-7k3q9x2m';
const $ = id => document.getElementById(id);
let pcCur = 0, pcStep = 0, cur = 0, follow = true;

function draw() {
  const [h, segs] = notes[cur];
  const step = follow ? Math.min(pcStep, segs.length - 1) : -1;
  $('n').textContent = `Diapo ${cur + 1}/${notes.length}` + (segs.length > 1 && follow ? ` · étape ${step}/${segs.length - 1}` : '');
  $('h').textContent = h;
  $('segs').innerHTML = segs.map((t, i) =>
    `<div class="seg ${!follow ? 'free' : i < step ? 'done' : i === step ? 'act' : ''}" id="s${i}">${t}</div>`).join('');
  const a = $('s' + Math.max(step, 0));
  if (a) a.scrollIntoView({ block: 'center' });
  $('nx').textContent = cur < notes.length - 1 ? 'Diapo suivante : ' + notes[cur + 1][0] : '';
  $('fl').className = follow ? 'on' : '';
  $('fl').textContent = follow ? 'Pilote le PC' : 'Revenir au PC';
}
function go(i) { cur = Math.max(0, Math.min(notes.length - 1, i)); follow = cur === pcCur; draw(); }
let link = null;
const remote = d => { if (link && link.open) link.send({ t: 'nav', d }); };
$('pv').onclick = () => follow ? remote(-1) : go(cur - 1);
$('nxb').onclick = () => follow ? remote(1) : go(cur + 1);
$('fl').onclick = () => { follow = true; cur = pcCur; draw(); };

let gen = 0;
function connect() {
  const me = ++gen;
  const st = s => me === gen && ($('st').textContent = s);
  const retry = (msg, ms) => {
    if (me !== gen) return;
    gen++; st(msg); link = null;
    try { peer.destroy(); } catch (e) {}
    setTimeout(connect, ms);
  };
  st('⏳ connexion au serveur…');
  const peer = new Peer({ config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:global.stun.twilio.com:3478' }, { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' }] } });
  let got = false;
  setTimeout(() => { if (!got) retry('🟠 pas de réponse du PC, nouvel essai…', 500); }, 12000);
  peer.on('open', () => {
    st('⏳ recherche du PC…');
    const c = peer.connect(hostId, { reliable: true });
    link = c;
    c.on('open', () => { if (me === gen) st('🟢 relié au PC'); });
    c.on('data', d => {
      if (me !== gen) return;
      if (d.t === 'state' && typeof d.state.cur === 'number') {
        got = true; st('🟢 relié au PC');
        pcCur = Math.min(d.state.cur, notes.length - 1);
        pcStep = d.state.step || 0;
        if (follow) cur = pcCur;
        draw();
      }
    });
    c.on('close', () => retry('🟠 reconnexion…', 1500));
  });
  peer.on('error', e => retry('🟠 ' + (e.type === 'peer-unavailable' ? 'PC introuvable (ouvre le diaporama)' : 'erreur ' + e.type) + ', nouvel essai…', 3000));
  peer.on('disconnected', () => { if (me === gen) peer.reconnect(); });
}
draw(); connect();
</script>
</body>
</html>
