<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Résultats en direct</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0f172a;color:#fff;height:100vh;display:flex;gap:4vw;padding:4vh 4vw;box-sizing:border-box}
.main{flex:1;display:flex;flex-direction:column}
h1{font-size:3.2vw;margin:0 0 3vh}
.row{margin:1.2vh 0}.lab{display:flex;justify-content:space-between;font-size:2vw;margin-bottom:.6vh}
.bar{background:#1e293b;border-radius:10px;height:4.5vh;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#3b82f6,#8b5cf6);width:0;transition:width .6s ease}
.side{width:22vw;text-align:center;display:flex;flex-direction:column;justify-content:center;gap:2vh}
.side img{width:100%;background:#fff;border-radius:16px;padding:8px;box-sizing:border-box}
.small{color:#94a3b8;font-size:1.3vw;word-break:break-all}.tot{font-size:1.8vw;color:#94a3b8;margin-top:2vh}
</style></head><body>
<div class="main"><h1 id="q"></h1><div id="rows"></div><div class="tot" id="tot"></div></div>
<div class="side"><div style="font-size:1.8vw">Scannez pour voter</div><img src="/qr.svg" alt="QR"><div class="small" id="url"></div></div>
<script>
fetch('/api/info').then(r=>r.json()).then(i=>url.textContent=i.url);
new EventSource('/events').onmessage = e => {
  const s = JSON.parse(e.data); if(!s.poll){q.textContent='—';return}
  q.textContent = s.poll.question;
  const tot = s.counts.reduce((a,b)=>a+b,0);
  if (rows.children.length !== s.poll.options.length || rows.dataset.p != s.poll.id) {
    rows.dataset.p = s.poll.id;
    rows.innerHTML = s.poll.options.map(()=>'<div class="row"><div class="lab"><span></span><span></span></div><div class="bar"><div class="fill"></div></div></div>').join('');
  }
  [...rows.children].forEach((r,i)=>{
    const c=s.counts[i], pct = tot?Math.round(c/tot*100):0;
    r.querySelectorAll('span')[0].textContent = s.poll.options[i];
    r.querySelectorAll('span')[1].textContent = `${c} (${pct}%)`;
    r.querySelector('.fill').style.width = pct+'%';
  });
  document.getElementById('tot').textContent = `${tot} vote${tot>1?'s':''}`;
};
</script></body></html>
